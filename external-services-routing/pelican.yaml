apiVersion: v1
kind: Service
metadata:
  name: pelican-svc
  namespace: external-services
spec:
  ports:
    - name: web
      port: 8080
      targetPort: 8080
  selector:
    app: pelican-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-proxy
  namespace: external-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pelican-proxy
  template:
    metadata:
      labels:
        app: pelican-proxy
    spec:
      containers:
      - name: socat
        image: alpine/socat
        args: ["TCP-LISTEN:8080,fork", "TCP:192.168.7.63:8080"]
        resources:
          requests:
            cpu: "10m"
            memory: "25Mi"
          limits:
            memory: "50Mi"
        ports:
        - containerPort: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pelican-tls-cert
  namespace: external-services
spec:
  secretName: pelican-ts-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "pelican.pimonlab.xyz"
  dnsNames:
  - "pelican.pimonlab.xyz"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pelican-ingress
  namespace: external-services
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pelican.pimonlab.xyz`)
      kind: Rule
      services:
        - name: pelican-svc
          port: 8080
  tls:
    secretName: pelican-ts-secret
